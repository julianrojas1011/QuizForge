name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Deterministic tests (no API keys or model downloads)
        run: python -m unittest discover -s tests -v
      - name: Offline example and CLI help
        run: |
          python demo.py
          python main.py --help
          python -m compileall -q main.py quiz.py stats.py rag.py llm.py planner.py demo.py

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Import runtime without downloading models or calling an API
        run: |
          python -c "import anthropic, numpy, sentence_transformers, dotenv"
          python -m unittest discover -s tests -v
